<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FancyRat-Wiki | 花枝鼠新手照護與日常知識庫</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>
</head>
<body class="bg-amber-50/50 text-stone-800 font-sans antialiased">

    <div class="min-h-screen flex flex-col md:flex-row">
        <!-- 側邊導覽列 -->
        <aside class="w-full md:w-72 bg-white border-r border-amber-100 p-6 flex flex-col justify-between shadow-sm">
            <div>
                <div class="flex items-center space-x-3 mb-8">
                    <span class="text-3xl">🐀</span>
                    <div>
                        <h1 class="font-bold text-lg text-amber-900">FancyRat-Wiki</h1>
                        <p class="text-xs text-stone-500">花枝鼠新手照護知識庫</p>
                    </div>
                </div>
                <nav id="nav-links" class="space-y-2">
                    <!-- 動態載入選單 -->
                </nav>
            </div>
            <div class="mt-8 pt-4 border-t border-stone-100 text-xs text-stone-400 text-center">
                Powered by AI & Claude Rules
            </div>
        </aside>

        <!-- 主內容區 -->
        <main class="flex-1 p-6 md:p-12 max-w-4xl mx-auto w-full">
            <article id="content-area" class="prose prose-amber max-w-none bg-white p-8 md:p-12 rounded-2xl shadow-sm border border-amber-100">
                <h2 class="text-2xl font-bold text-amber-900 mb-4">載入中...</h2>
                <p class="text-stone-600">正在讀取知識庫內容，請稍候。</p>
            </article>
        </main>
    </div>

    <script>
        async function loadWiki() {
            try {
                // 自動適應 GitHub Pages 子目錄的絕對路徑
                const basePath = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
                
                const res = await fetch(basePath + 'content/index.json');
                if (!res.ok) throw new Error('Cannot load index.json');
                const data = await res.json();
                
                const navContainer = document.getElementById('nav-links');
                navContainer.innerHTML = '';

                let firstFile = '';

                data.categories.forEach(cat => {
                    const section = document.createElement('div');
                    section.innerHTML = `<p class="text-xs font-semibold text-stone-400 uppercase tracking-wider mb-2 mt-4">${cat.name}</p>`;
                    
                    const ul = document.createElement('ul');
                    ul.className = 'space-y-1';

                    cat.articles.forEach((art, idx) => {
                        // 清理選單路徑中的 .md，讓 hash 保持乾淨
                        const cleanArtPath = art.path.replace(/\.md$/, '');
                        if (!firstFile && idx === 0 && cat === data.categories[0]) {
                            firstFile = cleanArtPath;
                        }
                        const li = document.createElement('li');
                        li.innerHTML = `
                            <a href="#${cleanArtPath}" onclick="loadMarkdown('${cleanArtPath}')" 
                               class="block px-3 py-2 rounded-lg text-sm text-stone-600 hover:bg-amber-50 hover:text-amber-800 transition font-medium">
                                ${art.title}
                            </a>
                        `;
                        ul.appendChild(li);
                    });
                    section.appendChild(ul);
                    navContainer.appendChild(section);
                });

                const hash = window.location.hash.substring(1);
                loadMarkdown(hash || firstFile);
            } catch (err) {
                document.getElementById('content-area').innerHTML = `<h2 class="text-red-600 font-bold">載入失敗</h2><p>無法讀取 content/index.json 索引檔。</p>`;
            }
        }

        async function loadMarkdown(path) {
            if (!path) return;
            try {
                
                let cleanPath = path.replace(/^\/+/, '').replace(/\.md$/, '');
                cleanPath += '.md';
                
                const basePath = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
                const targetUrl = basePath + 'content/' + cleanPath;
                
                const res = await fetch(targetUrl);
                if (!res.ok) throw new Error('File not found');
                
                const markdownText = await res.text();
                const contentWithoutFrontmatter = markdownText.replace(/^---[\s\S]*?---/, '');
                document.getElementById('content-area').innerHTML = marked.parse(contentWithoutFrontmatter);
            } catch (err) {
                document.getElementById('content-area').innerHTML = `
                    <h2 class="text-red-600 font-bold mb-2">找不到文章內容</h2>
                    <p class="text-stone-600 mb-4">無法讀取 <code>content/${path}.md</code></p>
                    <div class="bg-amber-50 p-4 rounded-lg text-xs text-stone-500">
                        <strong>檢查建議：</strong><br>
                        1. 請確認 GitHub 的 <code>content/</code> 資料夾內是否有該檔案。<br>
                        2. 請確認資料夾與檔案名稱的大小寫與連字號。
                    </div>`;
            }
        }

        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.substring(1);
            if (hash) loadMarkdown(hash);
        });

        loadWiki();
    </script>
</body>
</html>
